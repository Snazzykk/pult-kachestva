# quality-state.yml — состояние тест-фундамента проекта.
# Редактируется через «Пульт качества» (локальный UI). Можно править и руками.
# Модель (описания уровней, критерии Quality Gates) живёт в коде инструмента,
# здесь — только ответы «есть / нет» и цифры по конкретному проекту.

company: { name: Snazzy, updated: '2026-09-10' }
project:
  {
    manualRunHours: 40,
    releasesPerMonth: 2,
    rate: 30,
    autoHours: 80,
    coveredShare: null,
    qaInvolvement: 15,
    p1prevented: 4,
  }
practices:
  - {
      id: process,
      level: 1,
      target: 3,
      note: 'зовут на приёмку, на груминг — нет',
    }
  - {
      id: env,
      level: 3,
      target: 3,
      note: 'DEV / TEST / PREPROD / PROD, стабильно',
    }
  - {
      id: framework,
      level: 2,
      target: 3,
      note: 'pytest + requests, Page Object выделяю',
    }
  - {
      id: gate,
      level: 1,
      target: 3,
      note: 'тесты в CI есть, красный билд мёржат',
    }
  - {
      id: bugs,
      level: 2,
      target: 3,
      note: 'шаблон и severity есть, триаж нерегулярный',
    }
  - {
      id: testdata,
      level: 1,
      target: 3,
      note: 'дампы руками, тесты цепляются друг за друга',
    }
  - {
      id: reporting,
      level: 1,
      target: 3,
      note: 'таблица покрытия есть, обновляю нерегулярно',
    }
  - { id: nonfunc, level: 0, target: 2, note: '' }
  - {
      id: requirements,
      level: 1,
      target: 3,
      note: 'критериев приёмки нет, требования в Confluence устаревают',
    }
  - { id: observability, level: 0, target: 2, note: '' }
