# quality-state.yml — состояние тест-фундамента проекта.
# Редактируется через «Пульт качества» (локальный UI). Можно править и руками.
# Модель (описания уровней, критерии Quality Gates) живёт в коде инструмента,
# здесь — только ответы «есть / нет» и цифры по конкретному проекту.

