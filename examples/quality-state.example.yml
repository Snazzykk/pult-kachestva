infrastructure:
  - { id: redis, name: Redis, kind: cache }
  - { id: pg-catalog, name: catalog-db, kind: db }
  - { id: kafka, name: Kafka, kind: broker }
  - { id: pg-core, name: core-db, kind: db }
  - { id: psp, name: PSP, kind: external }
integrations:
  - [gateway, checkout, rest]
  - [gateway, catalog, rest]
  - [checkout, payments, rest]
  - [checkout, inventory, grpc]
  - [catalog, inventory, rest]
  - [gateway, search, rest]
infra_links:
  - [gateway, redis, 'чтение кеша']
  - [checkout, kafka, 'produce: orders.created']
  - [checkout, pg-core, чтение/запись]
  - [catalog, pg-catalog, чтение/запись]
  - [catalog, kafka, 'produce: catalog.updated']
  - [orders, kafka, 'consume: orders.created · produce: orders.status']
  - [orders, pg-core, чтение/запись]
  - [inventory, pg-core, чтение/запись]
  - [notifications, kafka, 'consume: orders.status']
  - [payments, psp, 'http (внешний провайдер)']
  - [payments, pg-core, чтение/запись]
  - [catalog, kafka, 'produce: catalog.updated']
  - [search, kafka, 'consume: catalog.updated']
  - [search, redis, кеш]
